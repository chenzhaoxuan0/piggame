<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 1;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	opacity: 0.85;
	pointer-events: none;
}

#status-progress, #start-btn, #status-hint {
	z-index: 2;
}

#start-btn, #status-hint {
	position: relative;
}

#status-progress, #status-notice, #start-btn {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* 点击开始门：浏览器自动播放策略要求音频上下文在用户手势之后创建。
   引擎真正 startGame 推迟到点击后，BGM 从第一个音符就能响（见壳脚本）。 */
#start-btn {
	margin-top: 2.2rem;
	padding: 1.1rem 3.2rem;
	font-size: 1.45rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 700;
	letter-spacing: 0.12em;
	color: #fff7e0;
	background: linear-gradient(180deg, #f5a623 0%, #d97a16 100%);
	border: 2px solid #ffe3a1;
	border-radius: 999px;
	box-shadow: 0 6px 22px rgba(245, 166, 35, 0.45);
	cursor: pointer;
}

#start-btn:hover {
	filter: brightness(1.08);
}

#start-btn:active {
	transform: translateY(2px);
}

#status-hint {
	display: none;
	margin-top: 0.9rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.92rem;
	color: #b9b3a6;
	letter-spacing: 0.04em;
}

/* 移动端竖屏轻提示胶囊（不阻断游戏；可一键切强制横屏或关闭） */
#rotate-hint {
	display: none;
	position: fixed;
	top: 10px;
	left: 50%;
	transform: translateX(-50%);
	z-index: 20;
	align-items: center;
	gap: 8px;
	padding: 6px 12px;
	background: rgba(255, 246, 224, 0.94);
	color: #28525e;
	border: 2px solid #3e8e9c;
	border-radius: 999px;
	box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 13px;
	font-weight: 700;
	white-space: nowrap;
}

#rotate-hint button {
	border: none;
	border-radius: 999px;
	padding: 4px 10px;
	font-size: 12px;
	font-weight: 700;
	cursor: pointer;
}

#rotate-force-btn {
	background: #3e8e9c;
	color: #fffdf6;
}

#rotate-dismiss-btn {
	background: transparent;
	color: #6e858b;
	padding: 2px 6px;
}

body.pig-force-landscape #canvas {
	position: fixed;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%) rotate(90deg);
	transform-origin: center center;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			您的浏览器不支持 canvas 标签。
		</canvas>

		<noscript>
			您的浏览器不支持 JavaScript。
		</noscript>

		<div id="status">
			<img id="status-splash" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<button id="start-btn" type="button">▶&nbsp; 点击开始</button>
			<div id="status-hint">正在载入农场，喝口水稍等一下…</div>
			<div id="status-notice"></div>
		</div>

		<div id="rotate-hint" role="status" aria-live="polite">
			<span>📱 横握手机体验更佳</span>
			<button id="rotate-force-btn" type="button">强制横屏</button>
			<button id="rotate-dismiss-btn" type="button" aria-label="关闭提示">✕</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

// ===== piggame web 壳改造（创空间加载优化 + 音频修复）=====
// 1) 传输压缩：托管（czx12138-piggame.ms.show）不输出 gzip/brotli，
//    index.wasm/index.pck 裸传 480MB。这里把引擎对这两个文件的 fetch
//    重定向到同名 .gz，用 DecompressionStream 在浏览器端解压；.gz 缺失
//    或浏览器不支持时自动回退原文件，导出目录两种都带上。
// 2) 音频：自动播放策略要求 AudioContext 在用户手势里创建。点「开始」时
//    先把上下文建好（手势内 → running），引擎创建时复用它，并挂 resume
//    兜底——避免主包加载完才建上下文、被判 suspended 而「游戏在跑却没声音」。
// 3) window.__pigAudioCtx 暴露引擎的 AudioContext；每 2s 向外层 postMessage
//    回报音频状态，跨域 iframe（创空间）里也能远程诊断。

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const startBtn = document.getElementById('start-btn');
	const statusHint = document.getElementById('status-hint');
	const canvas = document.getElementById('canvas');
	const rotateHint = document.getElementById('rotate-hint');
	const rotateForceBtn = document.getElementById('rotate-force-btn');
	const rotateDismissBtn = document.getElementById('rotate-dismiss-btn');

	// ===== 移动端识别 + 三层横屏适配（原生全屏锁横屏 → 竖屏轻提示 → 90° 旋转兜底）=====
	function detectMobile() {
		try {
			const ua = navigator.userAgent || '';
			const mobileUa = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
			const ipadOs = (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
			const coarse = Boolean(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
			return Boolean(mobileUa || ipadOs || (coarse && navigator.maxTouchPoints > 0));
		} catch (e) {
			return false;
		}
	}

	const IS_MOBILE = detectMobile();
	const origInnerWidthDesc = Object.getOwnPropertyDescriptor(window, 'innerWidth');
	const origInnerHeightDesc = Object.getOwnPropertyDescriptor(window, 'innerHeight');
	const origGetRect = canvas ? canvas.getBoundingClientRect.bind(canvas) : null;

	let landscapeMode = 'auto'; // 'auto' | 'force'
	let forceRotated = false;
	let hintDismissed = false;
	let rawW = window.innerWidth;
	let rawH = window.innerHeight;

	function readRawSize() {
		rawW = origInnerWidthDesc && origInnerWidthDesc.get ? origInnerWidthDesc.get.call(window) : document.documentElement.clientWidth;
		rawH = origInnerHeightDesc && origInnerHeightDesc.get ? origInnerHeightDesc.get.call(window) : document.documentElement.clientHeight;
	}

	function requestNativeLandscape() {
		try {
			const rootEl = document.documentElement;
			const reqFs = rootEl.requestFullscreen || rootEl.webkitRequestFullscreen;
			const lockOrientation = function () {
				try {
					if (screen.orientation && screen.orientation.lock) {
						const p = screen.orientation.lock('landscape');
						if (p && p.catch) { p.catch(function () {}); }
					}
				} catch (e) {}
			};
			if (reqFs && !document.fullscreenElement && !document.webkitFullscreenElement) {
				const p = reqFs.call(rootEl);
				if (p && p.then) {
					p.then(lockOrientation).catch(lockOrientation);
				} else {
					lockOrientation();
				}
			} else {
				lockOrientation();
			}
		} catch (e) {}
	}

	function applyLandscapeLayout() {
		readRawSize();
		const isPortrait = rawH > rawW;
		const wantRotate = (landscapeMode === 'force') && isPortrait;
		const changed = (wantRotate !== forceRotated);
		forceRotated = wantRotate;

		if (wantRotate) {
			document.body.classList.add('pig-force-landscape');
			try {
				Object.defineProperty(window, 'innerWidth', { get: function () { return rawH; }, configurable: true });
				Object.defineProperty(window, 'innerHeight', { get: function () { return rawW; }, configurable: true });
			} catch (e) {}
			if (canvas) {
				canvas.getBoundingClientRect = function () {
					return { x: 0, y: 0, left: 0, top: 0, width: rawH, height: rawW, right: rawH, bottom: rawW };
				};
			}
		} else {
			document.body.classList.remove('pig-force-landscape');
			try {
				if (origInnerWidthDesc) { Object.defineProperty(window, 'innerWidth', origInnerWidthDesc); }
				if (origInnerHeightDesc) { Object.defineProperty(window, 'innerHeight', origInnerHeightDesc); }
			} catch (e) {}
			if (canvas && origGetRect) {
				canvas.getBoundingClientRect = origGetRect;
			}
		}

		if (rotateHint) {
			const showHint = IS_MOBILE && isPortrait && !forceRotated && !hintDismissed && !initializing;
			rotateHint.style.display = showHint ? 'flex' : 'none';
		}

		if (changed) {
			window.dispatchEvent(new Event('resize'));
		}
	}

	// 90° 顺时针旋转兜底下的触控/指针坐标映射：(px, py) -> (py, rawW - px)
	function patchCoordObj(obj) {
		if (!obj || obj.__pigMapped) { return; }
		const px = obj.clientX;
		const py = obj.clientY;
		if (typeof px !== 'number' || typeof py !== 'number') { return; }
		const lx = py;
		const ly = rawW - px;
		try {
			Object.defineProperty(obj, 'clientX', { value: lx, configurable: true });
			Object.defineProperty(obj, 'clientY', { value: ly, configurable: true });
			Object.defineProperty(obj, 'pageX', { value: lx, configurable: true });
			Object.defineProperty(obj, 'pageY', { value: ly, configurable: true });
			obj.__pigMapped = true;
		} catch (e) {}
	}

	function remapInputForRotation(evt) {
		if (!forceRotated) { return; }
		if (evt.touches || evt.changedTouches) {
			const lists = [evt.touches, evt.changedTouches, evt.targetTouches];
			for (let i = 0; i < lists.length; i++) {
				const list = lists[i];
				if (!list) { continue; }
				for (let j = 0; j < list.length; j++) {
					patchCoordObj(list[j]);
				}
			}
		} else {
			patchCoordObj(evt);
		}
	}

	if (canvas) {
		['touchstart', 'touchmove', 'touchend', 'touchcancel', 'mousedown', 'mousemove', 'mouseup', 'pointerdown', 'pointermove', 'pointerup'].forEach(function (type) {
			canvas.addEventListener(type, remapInputForRotation, true);
		});
	}

	window.addEventListener('resize', function () {
		const prevW = rawW;
		const prevH = rawH;
		readRawSize();
		if (rawW !== prevW || rawH !== prevH) {
			applyLandscapeLayout();
		}
	});
	window.addEventListener('orientationchange', function () {
		setTimeout(applyLandscapeLayout, 120);
	});

	if (rotateForceBtn) {
		rotateForceBtn.addEventListener('click', function () {
			window.__pigMobile.setLandscapeMode('force');
		});
	}
	if (rotateDismissBtn) {
		rotateDismissBtn.addEventListener('click', function () {
			hintDismissed = true;
			if (rotateHint) { rotateHint.style.display = 'none'; }
		});
	}

	window.__pigMobile = {
		isMobile: IS_MOBILE,
		get landscapeMode() { return landscapeMode; },
		requestLandscape: requestNativeLandscape,
		setLandscapeMode: function (mode) {
			landscapeMode = (mode === 'force') ? 'force' : 'auto';
			if (landscapeMode === 'force') {
				requestNativeLandscape();
			}
			applyLandscapeLayout();
		},
		dismissRotateHint: function () {
			hintDismissed = true;
			applyLandscapeLayout();
		},
	};

	// ===== 音频上下文：手势内抢先建好，引擎复用同一个 =====
	// 浏览器的自动播放策略要求 AudioContext 在用户手势里创建，否则会停在
	// suspended，表现为「游戏在跑、一点声音都没有」。引擎的 AudioContext 是
	// 在 startGame() 内部、也就是主包加载完之后才建的——那时早已脱离手势，
	// 跨域 iframe（创空间 Studio）里尤其容易被判成 suspended，音频源建了
	// 也播不出来。
	// 所以点「开始」时我们先自己建一个（手势内 → 直接 running），引擎第一次
	// new AudioContext 时把这个现成的上下文交回去；任何一次交互再 resume 兜底。
	let preCtx = null;
	let preCtxUsed = false;
	let OrigAC = null;
	try {
		OrigAC = window.AudioContext || window.webkitAudioContext;
		if (OrigAC) {
			window.AudioContext = class extends OrigAC {
				constructor(...args) {
					if (preCtx && !preCtxUsed) {
						preCtxUsed = true;
						window.__pigAudioCtx = preCtx;
						return preCtx;
					}
					super(...args);
					window.__pigAudioCtx = this;
				}
			};
		}
	} catch (e) { OrigAC = null; /* 音频兜底失败也不影响游戏 */ }

	function audioState() {
		const c = window.__pigAudioCtx;
		return { pig: 'audio', state: c ? c.state : 'none', rate: c ? c.sampleRate : 0 };
	}
	function resumeAudio() {
		const c = window.__pigAudioCtx;
		if (c && c.state === 'suspended') { c.resume(); }
	}
	// 自动播放策略兜底：任何一次交互都尝试解锁
	window.addEventListener('pointerdown', resumeAudio, true);
	window.addEventListener('keydown', resumeAudio, true);
	// 给外层（创空间 iframe / 远程诊断）回报音频上下文状态
	setInterval(function () {
		try {
			if (window.parent !== window) { window.parent.postMessage(audioState(), '*'); }
		} catch (e) {}
	}, 2000);

	// -- gzip 传输补丁 + 构建版本化缓存击穿 --
	// 静态托管只发 Last-Modified 不发 Cache-Control，浏览器走启发式缓存；
	// 同名 index.wasm/index.pck 更新后，旧会话可能在新鲜度窗口内一直拿到旧包
	// （表现为「部署了却还是旧字体/旧逻辑」）。给 fetch URL 挂 ?v=<构建指纹>
	// （pck+wasm 字节数），构建一变 URL 就变，旧缓存条目自然失效。
	const CAN_GZIP = typeof DecompressionStream !== 'undefined';
	window.__pigGz = { on: CAN_GZIP, bytes: 0 };
	const BUILD_VER = String(
		(GODOT_CONFIG.fileSizes && GODOT_CONFIG.fileSizes['index.pck'] || 0) + '-' +
		(GODOT_CONFIG.fileSizes && GODOT_CONFIG.fileSizes['index.wasm'] || 0)
	);
	function withVer(url) {
		return url + (url.indexOf('?') === -1 ? '?' : '&') + 'v=' + BUILD_VER;
	}
	if (CAN_GZIP) {
		const origFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			const target = url.split('/').pop() || '';
			if ((target === 'index.wasm' || target === 'index.pck')) {
				return origFetch(withVer(url + '.gz')).then(function (gzResp) {
					if (!gzResp.ok || !gzResp.body) {
						return origFetch(typeof input === 'string' ? withVer(input) : input, init); // 无 .gz：回退原文件
					}
					const reportedTotal = Number(GODOT_CONFIG.fileSizes[target] || 0);
					const mime = target.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
					const headers = new Headers({ 'Content-Type': mime });
					if (reportedTotal > 0) {
						headers.set('Content-Length', String(reportedTotal));
					}
					// 进度按解压后字节计，total 用未压缩大小（preloader 语义），读数准确。
					const inflated = gzResp.body.pipeThrough(new DecompressionStream('gzip'));
					return new Response(inflated, { headers: headers });
				}).catch(function () {
					return origFetch(typeof input === 'string' ? withVer(input) : input, init);
				});
			}
			return origFetch(input, init);
		};
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('发生未知错误');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = '错误\n当前浏览器缺少运行 Godot 网页版所需的以下特性：\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
		return;
	}

	const engine = new Engine(Object.assign({}, GODOT_CONFIG, { 'onProgress': onProgress }));

	// 阶段一：立即预载引擎（wasm 走 .gz 补丁，带进度条）；
	// 阶段二：就绪后亮出「点击开始」；点击（用户手势）后才启动游戏，
	// 主包 pck 也在此时载入——AudioContext 于手势后创建，BGM 开局即响。
	setStatusMode('progress');
	statusHint.style.display = 'block';

	engine.init(GODOT_CONFIG.executable).then(function () {
		statusProgress.style.display = 'none';
		statusMode = ''; // 允许点击后重新进入 progress 态
		statusHint.style.display = 'none';
		startBtn.style.display = 'inline-block';
		statusOverlay.style.visibility = 'visible';
	}, displayFailureNotice);

	startBtn.addEventListener('click', function () {
		// 移动端点击开始手势内顺带尝试全屏锁横屏（浏览器仅允许手势内调用）
		if (IS_MOBILE) {
			requestNativeLandscape();
		}
		// 手势内先把 AudioContext 建起来：此刻创建才会直接是 running，
		// 引擎随后复用它（见上面的 AudioContext 包装）。
		try {
			if (!preCtx && OrigAC) {
				// 采样率对齐引擎的请求（AudioServer 默认混音率 44100），避免引擎拿到
			// 与预期不同的 rate 后还要回读适配。
				preCtx = new OrigAC({ sampleRate: 44100 });
				if (preCtx.state === 'suspended') { preCtx.resume(); }
			}
		} catch (e) { preCtx = null; }
		startBtn.style.display = 'none';
		statusHint.style.display = 'block';
		setStatusMode('progress');
		engine.startGame({
			'onProgress': onProgress,
		}).then(function () {
			setStatusMode('hidden');
			applyLandscapeLayout();
			// 留一条诊断线索：1 秒后音频上下文应处于 running。
			setTimeout(function () {
				const ctx = window.__pigAudioCtx;
				console.info('[piggame] audio ctx:', ctx ? ctx.state : '未创建');
				if (ctx && ctx.state === 'suspended') { ctx.resume(); }
			}, 1000);
		}, displayFailureNotice);
	});
}());
		</script>
	</body>
</html>
